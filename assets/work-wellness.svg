<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none" role="img" aria-label="Wellness clinic website mockup">
  <defs>
    <linearGradient id="wellBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b140b"/>
      <stop offset="1" stop-color="#122412"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#wellBg)"/>

  <!-- browser -->
  <rect x="70" y="52" width="500" height="316" rx="20" fill="#ffffff"/>
  <path d="M70 72a20 20 0 0 1 20-20h460a20 20 0 0 1 20 20v18H70V72z" fill="#ecfdf5"/>
  <circle cx="96" cy="64" r="6" fill="#ff5f57"/>
  <circle cx="116" cy="64" r="6" fill="#febc2e"/>
  <circle cx="136" cy="64" r="6" fill="#28c840"/>

  <!-- nav -->
  <rect x="98" y="106" width="94" height="16" rx="8" fill="url(#green)"/>
  <rect x="398" y="108" width="46" height="12" rx="6" fill="#c7ead9"/>
  <rect x="454" y="108" width="46" height="12" rx="6" fill="#c7ead9"/>
  <rect x="510" y="104" width="42" height="20" rx="10" fill="#059669"/>

  <!-- hero -->
  <rect x="98" y="150" width="216" height="24" rx="8" fill="#064e3b"/>
  <rect x="98" y="184" width="170" height="24" rx="8" fill="#7ce03e"/>
  <rect x="98" y="222" width="192" height="10" rx="5" fill="#b7e4cf"/>
  <rect x="98" y="240" width="150" height="10" rx="5" fill="#cdeee0"/>
  <rect x="98" y="272" width="140" height="34" rx="17" fill="url(#green)"/>
  <rect x="120" y="284" width="96" height="10" rx="5" fill="#0b140b"/>

  <!-- illustration: leaf + lotus circle -->
  <rect x="352" y="150" width="200" height="156" rx="16" fill="#ecfdf5"/>
  <circle cx="452" cy="228" r="52" fill="#0b140b"/>
  <path d="M452 190c-24 8-38 30-36 56 26 2 48-16 54-42-6 20-20 36-40 44" stroke="url(#green)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M452 268c14-6 24-18 28-32" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
  <circle cx="504" cy="278" r="16" fill="#10b981" opacity="0.35"/>

  <!-- booking slots -->
  <rect x="98" y="326" width="60" height="26" rx="13" fill="#ecfdf5"/>
  <rect x="166" y="326" width="60" height="26" rx="13" fill="#059669"/>
  <rect x="234" y="326" width="60" height="26" rx="13" fill="#ecfdf5"/>
  <rect x="302" y="326" width="60" height="26" rx="13" fill="#ecfdf5"/>
  <rect x="370" y="326" width="60" height="26" rx="13" fill="#ecfdf5"/>

  <!-- badge -->
  <g>
    <rect x="452" y="24" width="150" height="62" rx="16" fill="#0e160e"/>
    <rect x="452" y="24" width="150" height="62" rx="16" stroke="#7ce03e" stroke-opacity="0.5" stroke-width="2"/>
    <text x="474" y="54" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="800" fill="#7ce03e">#1</text>
    <text x="474" y="74" font-family="Inter, Arial, sans-serif" font-size="12" fill="#7e9c79">ranked locally</text>
