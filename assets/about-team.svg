<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" fill="none" role="img" aria-label="Illustration of a web design team building a website">
  <defs>
    <linearGradient id="abBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b140b"/>
      <stop offset="1" stop-color="#071007"/>
    </linearGradient>
    <linearGradient id="abBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ce03e"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="abSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="abGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="720" height="520" rx="32" fill="url(#abBg)"/>
  <circle cx="90" cy="90" r="58" fill="#7ce03e" opacity="0.12" filter="url(#abGlow)"/>
  <circle cx="640" cy="440" r="80" fill="#22c55e" opacity="0.14" filter="url(#abGlow)"/>
  <circle cx="612" cy="96" r="30" fill="#7ce03e" opacity="0.5"/>
  <circle cx="60" cy="440" r="4" fill="#7ce03e" opacity="0.7"/>
  <circle cx="686" cy="260" r="5" fill="#bef264" opacity="0.7"/>
  <circle cx="360" cy="34" r="3.5" fill="#22c55e" opacity="0.8"/>

  <!-- design canvas -->
  <g filter="url(#abSoft)">
    <rect x="86" y="70" width="404" height="300" rx="22" fill="#0e160e"/>
    <rect x="86" y="70" width="404" height="300" rx="22" stroke="#7ce03e" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M86 92a22 22 0 0 1 22-22h360a22 22 0 0 1 22 22v16H86V92z" fill="#162116"/>
    <circle cx="112" cy="86" r="6" fill="#ff5f57"/>
    <circle cx="132" cy="86" r="6" fill="#febc2e"/>
    <circle cx="152" cy="86" r="6" fill="#28c840"/>
  </g>

  <!-- wireframe blocks -->
  <rect x="112" y="132" width="160" height="20" rx="7" fill="#e9f6e3"/>
  <rect x="112" y="162" width="220" height="10" rx="5" fill="#2e4230"/>
  <rect x="112" y="180" width="180" height="10" rx="5" fill="#243526"/>
  <rect x="112" y="208" width="110" height="32" rx="16" fill="url(#abBrand)"/>
  <rect x="112" y="264" width="120" height="76" rx="14" fill="#16241a"/>
  <rect x="248" y="264" width="120" height="76" rx="14" fill="#14261e"/>
  <rect x="384" y="264" width="80" height="76" rx="14" fill="#1e2a12"/>

  <!-- selection frame -->
  <rect x="244" y="260" width="128" height="84" rx="16" stroke="#7ce03e" stroke-width="2.5" stroke-dasharray="8 7" fill="none"/>
  <rect x="240" y="256" width="9" height="9" rx="2" fill="#0e160e" stroke="#7ce03e" stroke-width="2"/>
  <rect x="367" y="256" width="9" height="9" rx="2" fill="#0e160e" stroke="#7ce03e" stroke-width="2"/>
  <rect x="240" y="339" width="9" height="9" rx="2" fill="#0e160e" stroke="#7ce03e" stroke-width="2"/>
  <rect x="367" y="339" width="9" height="9" rx="2" fill="#0e160e" stroke="#7ce03e" stroke-width="2"/>

  <!-- code card -->
  <g filter="url(#abSoft)">
    <rect x="380" y="300" width="264" height="168" rx="20" fill="#050905"/>
    <rect x="380" y="300" width="264" height="168" rx="20" stroke="#7ce03e" stroke-opacity="0.3" stroke-width="2"/>
    <circle cx="406" cy="326" r="5" fill="#ff5f57"/>
    <circle cx="424" cy="326" r="5" fill="#febc2e"/>
    <circle cx="442" cy="326" r="5" fill="#28c840"/>
    <rect x="404" y="350" width="86" height="9" rx="4.5" fill="#7ce03e"/>
    <rect x="498" y="350" width="54" height="9" rx="4.5" fill="#4ade80"/>
    <rect x="418" y="370" width="120" height="9" rx="4.5" fill="#bef264"/>
    <rect x="418" y="390" width="72" height="9" rx="4.5" fill="#a3e635"/>
    <rect x="404" y="410" width="150" height="9" rx="4.5" fill="#2e4230"/>
    <rect x="404" y="430" width="98" height="9" rx="4.5" fill="#7ce03e" opacity="0.6"/>
  </g>

  <!-- cursor -->
  <g filter="url(#abSoft)">
    <path d="M336 176l6 44 11-12 13 24 12-6-13-24 17-2-46-24z" fill="#7ce03e" stroke="#050905" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- floating badges -->
  <g filter="url(#abSoft)">
    <rect x="64" y="392" width="176" height="76" rx="18" fill="#0e160e"/>
    <rect x="64" y="392" width="176" height="76" rx="18" stroke="#7ce03e" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="102" cy="430" r="22" fill="#123018"/>
    <path d="M93 430l6 7 13-14" stroke="#7ce03e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="136" y="426" font-family="Sora, Arial, sans-serif" font-size="15" font-weight="800" fill="#e9f6e3">100%</text>
    <text x="136" y="446" font-family="Inter, Arial, sans-serif" font-size="12" fill="#7e9c79">on-time delivery</text>
  </g>

  <path d="M540 168l5 12 12 5-12 5-5 12-5-12-12-5 12-5 5-12z" fill="#bef264"/>
  <path d="M120 462l4 9 9 4-9 4-4 9-4-9-9-4 9-4 4-9z" fill="#7ce03e"/>
</svg>
