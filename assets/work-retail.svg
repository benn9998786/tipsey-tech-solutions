<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none" role="img" aria-label="Retail ecommerce store mockup">
  <defs>
    <linearGradient id="retailBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b140b"/>
      <stop offset="1" stop-color="#122412"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#retailBg)"/>

  <!-- browser -->
  <rect x="70" y="52" width="500" height="316" rx="20" fill="#ffffff"/>
  <path d="M70 72a20 20 0 0 1 20-20h460a20 20 0 0 1 20 20v18H70V72z" fill="#f5f3ff"/>
  <circle cx="96" cy="64" r="6" fill="#ff5f57"/>
  <circle cx="116" cy="64" r="6" fill="#febc2e"/>
  <circle cx="136" cy="64" r="6" fill="#28c840"/>

  <!-- nav -->
  <rect x="98" y="106" width="94" height="16" rx="8" fill="url(#violet)"/>
  <rect x="376" y="108" width="46" height="12" rx="6" fill="#ddd3f7"/>
  <rect x="432" y="108" width="46" height="12" rx="6" fill="#ddd3f7"/>
  <rect x="494" y="102" width="58" height="24" rx="12" fill="url(#violet)"/>
  <path d="M514 110h16l-2 10h-12l-2-10zM512 124h4v4h-4v-4zM528 124h4v4h-4v-4z" fill="#0e160e"/>

  <!-- search bar -->
  <rect x="98" y="142" width="454" height="34" rx="17" fill="#f5f3ff"/>
  <circle cx="122" cy="159" r="7" stroke="#a78bfa" stroke-width="3"/>
  <path d="M127 164l6 6" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  <rect x="142" y="154" width="180" height="10" rx="5" fill="#ddd3f7"/>

  <!-- product grid -->
  <g>
    <rect x="98" y="192" width="104" height="112" rx="14" fill="#faf9ff" stroke="#0b140b" stroke-width="2"/>
    <rect x="112" y="206" width="76" height="54" rx="10" fill="url(#violet)" opacity="0.85"/>
    <rect x="112" y="268" width="60" height="8" rx="4" fill="#c4b5fd"/>
    <rect x="112" y="282" width="40" height="8" rx="4" fill="#122412"/>

    <rect x="216" y="192" width="104" height="112" rx="14" fill="#faf9ff" stroke="#0b140b" stroke-width="2"/>
    <rect x="230" y="206" width="76" height="54" rx="10" fill="#a78bfa" opacity="0.85"/>
    <rect x="230" y="268" width="60" height="8" rx="4" fill="#c4b5fd"/>
    <rect x="230" y="282" width="40" height="8" rx="4" fill="#122412"/>

    <rect x="334" y="192" width="104" height="112" rx="14" fill="#faf9ff" stroke="#0b140b" stroke-width="2"/>
    <rect x="348" y="206" width="76" height="54" rx="10" fill="#8b5cf6" opacity="0.85"/>
    <rect x="348" y="268" width="60" height="8" rx="4" fill="#c4b5fd"/>
    <rect x="348" y="282" width="40" height="8" rx="4" fill="#122412"/>

    <rect x="452" y="192" width="104" height="112" rx="14" fill="#faf9ff" stroke="#0b140b" stroke-width="2"/>
    <rect x="466" y="206" width="76" height="54" rx="10" fill="#c4b5fd" opacity="0.9"/>
    <rect x="466" y="268" width="60" height="8" rx="4" fill="#c4b5fd"/>
    <rect x="466" y="282" width="40" height="8" rx="4" fill="#122412"/>
  </g>

  <!-- price tags -->
  <rect x="98" y="326" width="86" height="26" rx="13" fill="url(#violet)"/>
  <rect x="196" y="326" width="86" height="26" rx="13" fill="#f5f3ff"/>
  <rect x="294" y="326" width="86" height="26" rx="13" fill="#f5f3ff"/>

  <!-- badge -->
  <g>
    <rect x="452" y="24" width="150" height="62" rx="16" fill="#0e160e"/>
    <rect x="452" y="24" width="150" height="62" rx="16" stroke="#7ce03e" stroke-opacity="0.5" stroke-width="2"/>
    <text x="474" y="56" font-family="Sora, Arial, sans-serif" font-size="21" font-weight="800" fill="#7ce03e">£180k</text>
    <text x="474" y="74" font-family="Inter, Arial, sans-serif" font-size="12" fill="#7e9c79">first quarter</text>
  </g>
</svg>
