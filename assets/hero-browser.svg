<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none" role="img" aria-label="Illustration of a modern business website with analytics">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ce03e"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a10"/>
      <stop offset="1" stop-color="#0a110a"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ce03e" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7ce03e" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="greenGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- ambient bokeh + glow -->
  <circle cx="86" cy="96" r="70" fill="#7ce03e" opacity="0.10" filter="url(#greenGlow)"/>
  <circle cx="560" cy="430" r="96" fill="#22c55e" opacity="0.12" filter="url(#greenGlow)"/>
  <circle cx="546" cy="84" r="34" fill="#7ce03e" opacity="0.5"/>
  <circle cx="40" cy="300" r="5" fill="#7ce03e" opacity="0.7"/>
  <circle cx="612" cy="240" r="4" fill="#22c55e" opacity="0.7"/>
  <circle cx="330" cy="36" r="3.5" fill="#bef264" opacity="0.8"/>
  <circle cx="150" cy="470" r="4.5" fill="#7ce03e" opacity="0.5"/>

  <!-- browser window -->
  <g filter="url(#soft)">
    <rect x="60" y="60" width="520" height="380" rx="24" fill="url(#g2)"/>
    <rect x="60" y="60" width="520" height="380" rx="24" stroke="#7ce03e" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M60 84a24 24 0 0 1 24-24h472a24 24 0 0 1 24 24v28H60V84z" fill="#162116"/>
    <circle cx="92" cy="86" r="7" fill="#ff5f57"/>
    <circle cx="116" cy="86" r="7" fill="#febc2e"/>
    <circle cx="140" cy="86" r="7" fill="#28c840"/>
    <rect x="176" y="74" width="300" height="24" rx="12" fill="#0a110a"/>
    <text x="326" y="91" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#7e9c79">yourbusiness.com</text>
  </g>

  <!-- page content -->
  <rect x="92" y="132" width="180" height="22" rx="8" fill="#e9f6e3"/>
  <rect x="92" y="164" width="240" height="12" rx="6" fill="#2e4230"/>
  <rect x="92" y="184" width="200" height="12" rx="6" fill="#243526"/>
  <rect x="92" y="214" width="128" height="38" rx="19" fill="url(#g1)"/>
  <text x="156" y="238" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#06130a">Get started</text>
  <rect x="232" y="214" width="120" height="38" rx="19" fill="#0a110a" stroke="#7ce03e" stroke-opacity="0.5" stroke-width="2"/>
  <text x="292" y="238" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#7ce03e">Learn more</text>

  <!-- product cards -->
  <g>
    <rect x="92" y="278" width="136" height="120" rx="14" fill="#131f13" stroke="#7ce03e" stroke-opacity="0.25" stroke-width="2"/>
    <rect x="108" y="294" width="104" height="52" rx="10" fill="#1c2c1c"/>
    <rect x="108" y="356" width="84" height="10" rx="5" fill="#2e4230"/>
    <rect x="108" y="372" width="56" height="10" rx="5" fill="#243526"/>

    <rect x="244" y="278" width="136" height="120" rx="14" fill="#131f13" stroke="#7ce03e" stroke-opacity="0.25" stroke-width="2"/>
    <rect x="260" y="294" width="104" height="52" rx="10" fill="#1a2f22"/>
    <rect x="260" y="356" width="84" height="10" rx="5" fill="#2e4230"/>
    <rect x="260" y="372" width="56" height="10" rx="5" fill="#243526"/>

    <rect x="396" y="278" width="136" height="120" rx="14" fill="#131f13" stroke="#7ce03e" stroke-opacity="0.25" stroke-width="2"/>
    <rect x="412" y="294" width="104" height="52" rx="10" fill="#243215"/>
    <rect x="412" y="356" width="84" height="10" rx="5" fill="#2e4230"/>
    <rect x="412" y="372" width="56" height="10" rx="5" fill="#243526"/>
  </g>

  <!-- floating analytics card -->
  <g filter="url(#soft2)">
    <rect x="382" y="336" width="226" height="140" rx="20" fill="#0e160e"/>
    <rect x="382" y="336" width="226" height="140" rx="20" stroke="#7ce03e" stroke-opacity="0.4" stroke-width="2"/>
    <text x="404" y="368" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#7e9c79">Monthly revenue</text>
    <text x="404" y="398" font-family="Sora, Arial, sans-serif" font-size="26" font-weight="800" fill="#e9f6e3">£48,290</text>
    <rect x="520" y="378" width="68" height="24" rx="12" fill="#123018"/>
    <text x="554" y="394" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#7ce03e">+32%</text>
    <path d="M404 452 L436 440 L466 446 L498 424 L528 430 L560 410 L586 416" stroke="#7ce03e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M404 452 L436 440 L466 446 L498 424 L528 430 L560 410 L586 416 V462 H404 Z" fill="url(#chart)"/>
  </g>

  <!-- floating speed badge -->
  <g filter="url(#soft2)">
    <rect x="34" y="330" width="150" height="70" rx="18" fill="#0e160e"/>
    <rect x="34" y="330" width="150" height="70" rx="18" stroke="#7ce03e" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="72" cy="365" r="22" fill="#1c2c1c"/>
    <path d="M72 353v12l8 6" stroke="#7ce03e" stroke-width="3" stroke-linecap="round"/>
    <text x="106" y="360" font-family="Sora, Arial, sans-serif" font-size="17" font-weight="800" fill="#e9f6e3">0.9s</text>
    <text x="106" y="380" font-family="Inter, Arial, sans-serif" font-size="12" fill="#7e9c79">load time</text>
  </g>

  <!-- sparkles -->
  <path d="M566 176l6 14 14 6-14 6-6 14-6-14-14-6 14-6 6-14z" fill="#bef264"/>
  <path d="M40 190l5 11 11 5-11 5-5 11-5-11-11-5 11-5 5-11z" fill="#7ce03e" opacity="0.85"/>
</svg>
